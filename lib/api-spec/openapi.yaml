          content: { application/json: { schema: { $ref: "#/components/schemas/CurrencyRate" } } }
  /currency-rates/latest:
    get:
      operationId: getLatestCurrencyRate
      tags: [shell]
      responses:
        "200":
          description: Latest USD rate
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/CurrencyRate" }
                  - type: object
                    required: [rate]
                    properties:
                      rate: { type: "null" }
  /currency-rates/{id}:
    delete:
      operationId: deleteCurrencyRate
      tags: [shell]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /favorites:
    get:
      operationId: listFavorites
      tags: [shell]
      responses:
        "200":
          description: User favourites
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Favorite" } } } }
    post:
      operationId: createFavorite
      tags: [shell]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FavoriteInput" } } }
      responses:
        "201":
          description: Added favourite
          content: { application/json: { schema: { $ref: "#/components/schemas/Favorite" } } }
        "409": { description: Already a favourite }
  /favorites/{id}:
    delete:
      operationId: deleteFavorite
      tags: [shell]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /items/price-lookup:
    get:
      operationId: getItemPriceLookup
      tags: [shell]
      parameters:
        - in: query
          name: barcode
          schema: { type: string }
        - in: query
          name: itemId
          schema: { type: number, minimum: 1 }
      responses:
        "200":
          description: Item prices and stock
          content: { application/json: { schema: { $ref: "#/components/schemas/ItemPriceLookup" } } }
        "404": { description: Item not found }
  /session/login-info:
    get:
      operationId: getSessionLoginInfo
      tags: [shell]
      responses:
        "200":
          description: Current session information
          content: { application/json: { schema: { $ref: "#/components/schemas/SessionLoginInfo" } } }
  # ==== END AREA: shell paths ====
  # ==== AREA: config-org paths ====
  /lookups/{kind}:
    get:
      operationId: listLookups
      tags: [lookups]
      summary: List rows of a shared lookup table (item types, cities, expense types, ...)
      parameters:
        - $ref: "#/components/parameters/LookupKind"
      responses:
        "200":
          description: Lookup rows ordered by sortOrder then name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LookupItem"
    post:
      operationId: createLookup
      tags: [lookups]
      parameters:
        - $ref: "#/components/parameters/LookupKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupInput"
      responses:
        "201":
          description: Lookup row created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupItem"
  /lookups/{kind}/{id}:
    patch:
      operationId: updateLookup
      tags: [lookups]
      parameters:
        - $ref: "#/components/parameters/LookupKind"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupInput"
      responses:
        "200":
          description: Lookup row updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupItem"
        "404":
          description: Lookup row not found
    delete:
      operationId: deleteLookup
      tags: [lookups]
      parameters:
        - $ref: "#/components/parameters/LookupKind"
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Lookup row soft-deleted
        "404":
          description: Lookup row not found
  # ==== END AREA: config-org paths ====
  # ==== AREA: accounts paths ====
  # ==== END AREA: accounts paths ====
  # ==== AREA: items-store paths ====
  # ==== END AREA: items-store paths ====
  # ==== AREA: sales paths ====
  # ==== END AREA: sales paths ====
  # ==== AREA: purchases paths ====
  # ==== END AREA: purchases paths ====
  # ==== AREA: accounting paths ====
  # ==== END AREA: accounting paths ====
  # ==== AREA: reports paths ====
  # ==== END AREA: reports paths ====
  /admin/backups:
    get:
      operationId: listBackupJobs
      tags: [organization]
      summary: List backup jobs and Telegram delivery attempts (admin only)
      responses:
        "200":
          description: Backup jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupJob" }
        "403": { description: Administrator permission required }
  /admin/backups/status:
    get:
      operationId: getBackupStatus
      tags: [organization]
      summary: Get backup, schedule, encryption and Telegram status (admin only)
      responses:
        "200":
          description: Backup administration status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
        "403": { description: Administrator permission required }
  /admin/backups/settings:
    put:
      operationId: updateBackupSettings
      tags: [organization]
      summary: Configure the Asia/Baghdad backup schedule (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSettingsInput" }
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
  /admin/backups/now:
    post:
      operationId: createBackupNow
      tags: [organization]
      summary: Queue an encrypted backup now (admin only)
      responses:
        "202":
          description: Backup queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupJob" }
        "503": { description: Backup encryption is not configured }
  /admin/backups/{id}/verify:
    post:
      operationId: verifyBackup
      tags: [organization]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Archive checksum and authenticated encryption verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupVerification" }
  /admin/backups/{id}/restore/prepare:
    post:
      operationId: prepareBackupRestore
      tags: [organization]
      summary: Create mandatory safety backup and verify restore source without restoring
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Restore prerequisites are ready; no restore was executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestorePreparation" }
components:
  parameters:
    ReportFrom:
      in: query
      name: from
      schema: { type: string, format: date }
    ReportTo:
      in: query
      name: to
      schema: { type: string, format: date }
    ReportAccountId:
      in: query
      name: accountId
      schema: { type: number, minimum: 1 }
    ReportWorkplaceId:
      in: query
      name: workplaceId
      schema: { type: number, minimum: 1 }
    ReportWarehouseId:
      in: query
      name: warehouseId
      schema: { type: number, minimum: 1 }
    ReportStatus:
      in: query
      name: status
      schema: { type: string }
    ReportCurrency:
      in: query
      name: currency
      schema: { type: string, minLength: 1 }
    Id:
      in: path
      name: id
      required: true
      schema:
        type: number
        minimum: 1
    LookupKind:
      in: path
      name: kind
      required: true
      schema:
        $ref: "#/components/schemas/LookupKind"
    WorkplaceIdQuery:
      in: query
      name: workplaceId
      schema:
        type: number
        minimum: 1
  schemas:
    BackupSettings:
      type: object
      required: [id, enabled, frequency, localTime, timezone, retentionCount]
      properties:
        id: { type: number }
        enabled: { type: boolean }
        frequency: { type: string, enum: [daily, weekly, monthly, custom] }
        localTime: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        dayOfWeek: { type: [number, "null"], minimum: 0, maximum: 6 }
        dayOfMonth: { type: [number, "null"], minimum: 1, maximum: 31 }
        customCron: { type: [string, "null"] }
        timezone: { type: string, enum: [Asia/Baghdad] }
        retentionCount: { type: number, minimum: 1, maximum: 365 }
        updatedBy: { type: [number, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    BackupSettingsInput:
      type: object
      required: [enabled, frequency, localTime, retentionCount]
      properties:
        enabled: { type: boolean }
        frequency: { type: string, enum: [daily, weekly, monthly, custom] }
        localTime: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        dayOfWeek: { type: [number, "null"], minimum: 0, maximum: 6 }
        dayOfMonth: { type: [number, "null"], minimum: 1, maximum: 31 }
        customCron: { type: [string, "null"], maxLength: 100 }
        retentionCount: { type: number, minimum: 1, maximum: 365 }
    TelegramDeliveryAttempt:
      type: object
      required: [id, backupJobId, attempt, status, attemptedAt]
      properties:
        id: { type: number }
        backupJobId: { type: number }
        attempt: { type: number }
        status: { type: string, enum: [sending, sent, retrying, failed, unconfigured] }
        error: { type: [string, "null"] }
        telegramMessageId: { type: [string, "null"] }
        attemptedAt: { type: string, format: date-time }
        nextRetryAt: { type: [string, "null"], format: date-time }
    BackupJob:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: number }
        kind: { type: string, enum: [manual, scheduled, pre_restore] }
        status: { type: string, enum: [queued, running, completed, failed] }
        scheduledFor: { type: [string, "null"], format: date-time }
        requestedBy: { type: [number, "null"] }
        archivePath: { type: [string, "null"] }
        checksumSha256: { type: [string, "null"] }
        archiveBytes: { type: [number, "null"] }
        encryption: { type: ["object", "null"], additionalProperties: true }
        error: { type: [string, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        telegramAttempts:
          type: array
          items: { $ref: "#/components/schemas/TelegramDeliveryAttempt" }
    BackupStatus:
      type: object
      required: [timezone, encryptionConfigured, telegramConfigured, schedule]
      properties:
        timezone: { type: string, enum: [Asia/Baghdad] }
        encryptionConfigured: { type: boolean }
        telegramConfigured: { type: boolean }
        schedule: { $ref: "#/components/schemas/BackupSettings" }
    BackupVerification:
      type: object
      required: [id, verified, checksumSha256]
      properties:
        id: { type: number }
        verified: { type: boolean, const: true }
        checksumSha256: { type: string }
    RestorePreparation:
      type: object
      required: [ready, restoreExecuted, sourceBackupId, preRestoreBackupId, semantics]
      properties:
        ready: { type: boolean, const: true }
        restoreExecuted: { type: boolean, const: false }
        sourceBackupId: { type: number }
        preRestoreBackupId: { type: number }
        semantics: { type: string }
    # ==== AREA: shell schemas ====
    CurrencyRate:
      type: object
      required: [id, currencyId, currencyName, currencyCode, rate, rateDate, recordedByUserId, recordedByName, createdAt]
      properties:
        id: { type: number }
        currencyId: { type: number }
        currencyName: { type: string }
        currencyCode: { type: string }
        rate: { type: number }
        rateDate: { type: string, format: date }
        recordedByUserId: { type: number }
        recordedByName: { type: string }
        createdAt: { type: string, format: date-time }
    CurrencyRateInput:
      type: object
      required: [currencyId, rate, rateDate]
      properties:
        currencyId: { type: number, minimum: 1 }
        rate: { type: number, exclusiveMinimum: 0 }
        rateDate: { type: string, format: date }
    Favorite:
      type: object
      required: [id, path, title, sortOrder, createdAt]
      properties:
        id: { type: number }
        path: { type: string }
        title: { type: string }
        sortOrder: { type: number }
        createdAt: { type: string, format: date-time }
    FavoriteInput:
      type: object
      required: [path, title]
      properties:
        path: { type: string, minLength: 1, maxLength: 500 }
        title: { type: string, minLength: 1, maxLength: 200 }
    WarehouseStock:
      type: object
      required: [warehouseId, warehouseName, quantity]
      properties:
        warehouseId: { type: number }
        warehouseName: { type: string }
        quantity: { type: number }
    ItemPriceLookup:
      type: object
      required: [id, name, barcode, unit, retailPrice, wholesalePrice, specialPrice, extraPrice, stock]
      properties:
        id: { type: number }
        name: { type: string }
        barcode: { type: string }
        unit: { type: string }
        retailPrice: { type: number }
        wholesalePrice: { type: number }
        specialPrice: { type: number }
        extraPrice: { type: number }
        stock: { type: array, items: { $ref: "#/components/schemas/WarehouseStock" } }
    SessionLoginInfo:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: number }
        username: { type: string }
        displayName: { type: string }
        lastLoginAt: { type: [string, "null"], format: date-time }
    # ==== END AREA: shell schemas ====
    # ==== AREA: config-org schemas ====
    LookupKind:
      type: string
      description: >
        Shared lookup tables. Storeconfig: item-types (جۆرەکان), item-subtypes (جۆری لاوەکی, parent item-types),
        item-subtypes2 (جۆری لاوەکی ٢, parent item-subtypes), item-models (مۆدێل), item-sizes (قەبارە),
        countries (وڵات), colors (ڕەنگ), release-dates (بەرواری دەرچوون), item-attributes (سیفەت),
        item-versions (وەشان). accountconfiguration: cities (شار), account-types (جۆر), account-class1..5
        (پۆلێنی یەکەم..پێنجەم, each parented by the previous level), account-classes (کڵاس, has color),
        ownership-types (جۆری خاوەندارێتی). accountingconfigurations: expense-types (جۆری خەرجی, has code),
        expense-subtypes (جۆری خەرجی لاوەکی, parent expense-types), purchase-expense-types (جۆری خەرجی کڕین,
        has onAccount), income-types (جۆری داهات, has code), income-subtypes (جۆری لاوەکی داهات, parent
        income-types). purchaseissueconfig: purchase-issue-types.
      enum:
        - item-types
        - item-subtypes
        - item-subtypes2
        - item-models
        - item-sizes
        - countries
        - colors
        - release-dates
        - item-attributes
        - item-versions
        - cities
        - account-types
        - account-class1
        - account-class2
        - account-class3
        - account-class4
        - account-class5
        - account-classes
        - ownership-types
        - expense-types
        - expense-subtypes
        - purchase-expense-types
        - income-types
        - income-subtypes
        - purchase-issue-types
    LookupItem:
      type: object
      required: [id, kind, name, nameKu, nameAr, nameEn, parentId, parentName, code, color, isPrimary, onAccount, sortOrder, deletedAt, createdAt, updatedAt]
      properties:
        id: { type: number }
        kind: { $ref: "#/components/schemas/LookupKind" }
        name: { type: string, description: Display name (Kurdish name for trilingual kinds) }
        nameKu: { type: string }
        nameAr: { type: string }
        nameEn: { type: string }
        parentId: { type: [number, "null"] }
        parentName: { type: [string, "null"] }
        code: { type: string }
        color: { type: string }
        isPrimary: { type: boolean }
        onAccount: { type: boolean }
        sortOrder: { type: number }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LookupInput:
      type: object
      description: >
        Send `name` for single-name kinds and `nameKu` (+ optional nameAr/nameEn) for trilingual kinds;
        `parentId` is required for child kinds. Unknown fields for a kind are ignored.
      properties:
        name: { type: string, minLength: 1 }
        nameKu: { type: string, minLength: 1 }
        nameAr: { type: string }
        nameEn: { type: string }
        parentId: { type: [number, "null"] }
        code: { type: string }
        color: { type: string }
        isPrimary: { type: boolean }
        onAccount: { type: boolean }
        sortOrder: { type: number }
    # ==== END AREA: config-org schemas ====
    # ==== AREA: accounts schemas ====
    # ==== END AREA: accounts schemas ====
    # ==== AREA: items-store schemas ====
    # ==== END AREA: items-store schemas ====
    # ==== AREA: sales schemas ====
    # ==== END AREA: sales schemas ====
    # ==== AREA: purchases schemas ====
    # ==== END AREA: purchases schemas ====
