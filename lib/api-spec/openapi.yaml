      operationId: listBusinessDocuments
      tags: [invoices]
      summary: List sales and purchase workflow documents
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [purchase_order, purchase_payment, sale_offer, sale_return, sale_talaf, sale_collection]
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, sent, approved, completed, cancelled]
      responses:
        "200":
          description: Workflow documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessDocument"
    post:
      operationId: createBusinessDocument
      tags: [invoices]
      summary: Create a sales or purchase workflow document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessDocumentInput"
      responses:
        "201":
          description: Workflow document created
          content:
