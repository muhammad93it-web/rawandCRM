        "401":
          description: Missing session or invalid current password
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: number
        minimum: 1
    WorkplaceIdQuery:
      in: query
      name: workplaceId
      schema:
        type: number
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    MoneyPoint:
      type: object
      required: [label, sales, purchases]
      properties:
        label:
          type: string
        sales:
          type: number
        purchases:
          type: number
    TopItem:
      type: object
      required: [name, quantity, revenue]
      properties:
        name:
          type: string
        quantity:
          type: number
        revenue:
          type: number
    DashboardSummary:
      type: object
      required:
        - salesToday
        - purchasesToday
        - receivables
        - payables
        - itemsCount
        - lowStockCount
        - customersCount
        - revenueSeries
        - topItems
      properties:
        salesToday:
          type: number
        purchasesToday:
          type: number
        receivables:
          type: number
        payables:
          type: number
        itemsCount:
          type: number
        lowStockCount:
          type: number
        customersCount:
          type: number
        revenueSeries:
          type: array
          items:
            $ref: "#/components/schemas/MoneyPoint"
        topItems:
          type: array
          items:
            $ref: "#/components/schemas/TopItem"
    Activity:
      type: object
      required: [id, kind, title, description, amount, currency, createdAt]
      properties:
        id:
          type: number
        kind:
          type: string
          enum: [sale, purchase, income, expense, stock, account]
        title:
          type: string
        description:
          type: string
        amount:
          type: number
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
    Account:
      type: object
      required: [id, name, type, phone, city, balance, currency, status, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        type:
          type: string
          enum: [customer, supplier, other]
        phone:
          type: string
        city:
          type: string
        balance:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
    AccountInput:
      type: object
      required: [name, type, phone, city, balance, currency]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [customer, supplier, other]
        phone:
          type: string
        city:
          type: string
        balance:
          type: number
        currency:
          type: string
    AccountUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [customer, supplier, other]
        phone:
          type: string
        city:
          type: string
        balance:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [active, inactive]
    Item:
      type: object
      required:
        [id, name, barcode, category, brand, quantity, reorderLevel, purchasePrice, salePrice, unit, status, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        barcode:
          type: string
        category:
          type: string
        brand:
          type: string
        quantity:
          type: number
        reorderLevel:
          type: number
        purchasePrice:
          type: number
        salePrice:
          type: number
        unit:
          type: string
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
    ItemInput:
      type: object
      required: [name, barcode, category, brand, quantity, reorderLevel, purchasePrice, salePrice, unit]
      properties:
        name:
          type: string
          minLength: 1
        barcode:
          type: string
        category:
          type: string
        brand:
          type: string
        quantity:
          type: number
        reorderLevel:
          type: number
        purchasePrice:
          type: number
        salePrice:
          type: number
        unit:
          type: string
    ItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        barcode:
          type: string
        category:
          type: string
        brand:
          type: string
        quantity:
          type: number
        reorderLevel:
          type: number
        purchasePrice:
          type: number
        salePrice:
          type: number
        unit:
          type: string
        status:
          type: string
          enum: [active, inactive]
    InvoiceLineInput:
      type: object
      required: [itemId, quantity, unitPrice, discount]
      properties:
        itemId:
          type: number
        quantity:
          type: number
          exclusiveMinimum: 0
        unitPrice:
          type: number
          minimum: 0
        discount:
          type: number
          minimum: 0
    Invoice:
      type: object
      required: [id, number, type, accountName, date, total, currency, paymentType, status, itemsCount]
      properties:
        id:
          type: number
        number:
          type: string
        type:
          type: string
          enum: [sale, purchase]
        accountName:
          type: string
        date:
          type: string
          format: date
        total:
          type: number
        currency:
          type: string
        paymentType:
          type: string
          enum: [cash, credit]
        status:
          type: string
          enum: [completed, draft, cancelled]
        itemsCount:
          type: number
    InvoiceInput:
      type: object
      required: [accountId, date, currency, paymentType, lines]
      properties:
        accountId:
          type: number
        date:
          type: string
          format: date
        currency:
          type: string
        paymentType:
          type: string
          enum: [cash, credit]
        notes:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceLineInput"
    Transaction:
      type: object
      required: [id, type, date, category, description, accountName, amount, currency, status]
      properties:
        id:
          type: number
        type:
          type: string
          enum: [income, expense]
        date:
          type: string
          format: date
        category:
          type: string
        description:
          type: string
        accountName:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [posted, draft]
    TransactionInput:
      type: object
      required: [type, date, category, description, accountName, amount, currency]
      properties:
        type:
          type: string
          enum: [income, expense]
        date:
          type: string
          format: date
        category:
          type: string
        description:
          type: string
        accountName:
          type: string
        amount:
          type: number
          minimum: 0
        currency:
          type: string
    FinancialEntry:
      type: object
      required: [id, type, entryDate, category, description, amount, currency, paymentMethod, dueDate, status, attachmentUrl, createdAt]
      properties:
        id: { type: number }
        workplaceId: { type: [number, "null"] }
        accountId: { type: [number, "null"] }
        cashBoxId: { type: [number, "null"] }
        type: { type: string, enum: [income, expense, debt, capital, profit_loss] }
        entryDate: { type: string, format: date }
        category: { type: string }
        description: { type: string }
        amount: { type: number }
        currency: { type: string }
        paymentMethod: { type: string }
        dueDate: { type: [string, "null"], format: date }
        status: { type: string, enum: [draft, posted, settled, cancelled] }
        attachmentUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    FinancialEntryInput:
      type: object
      required: [type, entryDate, amount, currency]
      properties:
        workplaceId: { type: [number, "null"] }
        accountId: { type: [number, "null"] }
        cashBoxId: { type: [number, "null"] }
        type: { type: string, enum: [income, expense, debt, capital, profit_loss] }
        entryDate: { type: string, format: date }
        category: { type: string, default: "" }
        description: { type: string, default: "" }
        amount: { type: number, minimum: 0 }
        currency: { type: string, minLength: 1 }
        paymentMethod: { type: string, default: "" }
        dueDate: { type: [string, "null"], format: date }
        status: { type: string, enum: [draft, posted, settled, cancelled], default: posted }
        attachmentUrl: { type: [string, "null"] }
    FinancialEntryUpdate:
      type: object
      properties:
        workplaceId: { type: [number, "null"] }
        accountId: { type: [number, "null"] }
        cashBoxId: { type: [number, "null"] }
        type: { type: string, enum: [income, expense, debt, capital, profit_loss] }
        entryDate: { type: string, format: date }
        category: { type: string }
        description: { type: string }
        amount: { type: number, minimum: 0 }
        currency: { type: string, minLength: 1 }
        paymentMethod: { type: string }
        dueDate: { type: [string, "null"], format: date }
        status: { type: string, enum: [draft, posted, settled, cancelled] }
        attachmentUrl: { type: [string, "null"] }
    Currency:
      type: object
      required: [id, code, name, rate, decimals, symbol, status, createdAt, updatedAt]
      properties:
        id: { type: number }
        code: { type: string }
